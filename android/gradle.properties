# Limit memory usage by Gradle (helps prevent crashes)
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Reduce parallelism to avoid CPU overload
org.gradle.workers.max=2

# Enable useful caching features (can help over time)
org.gradle.daemon=true
org.gradle.configureondemand=true
org.gradle.caching=true

# Optional: turn off parallel execution if CPU is weak
org.gradle.parallel=false

# Required for AndroidX support
android.useAndroidX=true
android.enableJetifier=true